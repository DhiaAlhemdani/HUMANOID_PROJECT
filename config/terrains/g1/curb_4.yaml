# 4 cm curb rung: 3 m plateaus at x = 2-5, 7-10, 12-15 (six curbs per direction), mirrored at -x. 4 cm is below the 5 cm swing height.
course:
  model: g1_curb_4
  half_width: 3.0
  mirror_x: true
  friction: [0.9, 0.005, 0.0001]
  plateaus:
  - name: curb_0
    x: [2.0, 5.0]
    top: 0.04
  - name: curb_1
    x: [7.0, 10.0]
    top: 0.04
  - name: curb_2
    x: [12.0, 15.0]
    top: 0.04
