# 5 degree slope rung: 6 m up, 2 m plateau, 6 m down (0.525 m rise), mirrored at -x for the backward ladder.
course:
  model: g1_slope_5
  half_width: 3.0
  mirror_x: true
  friction: [0.9, 0.005, 0.0001]
  ramps:
  - name: ramp_up
    x: [1.5, 7.5]
    z: [0.0, 0.525]
  - name: ramp_down
    x: [9.5, 15.5]
    z: [0.525, 0.0]
  plateaus:
  - name: plateau
    x: [7.5, 9.5]
    top: 0.525
