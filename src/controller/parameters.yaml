          the feet toward a C1 smoothstep transfer across each DS window, shaping the contact-handover
          force rate (D2/D3); registered only when > 0", validation: {gt_eq: [0.0]}}
      contactLoadShareLiftOffWindow: {type: double, default_value: 0.0, description: "Load-share cost end
