          (1 - tau/window)^2 towards the switch, so the lifting foot's force reaches zero continuously
          instead of dropping in one node) and leaves the rest of the double support free. 0 with the
          touchdown window also 0 = the whole-DS smoothstep", validation: {gt_eq: [0.0]}}
      contactLoadShareTouchDownWindow: {type: double, default_value: 0.0, description: "Load-share cost end
