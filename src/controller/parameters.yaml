            first 10 % of swing. The human heel is up for the last quarter of stance; a flat-foot robot cannot be."}
        maxStanceDorsiflexion: {type: double, default_value: 0.44, description: "With stanceAnkleClosure, the stance
            knee is capped so the closed ankle stays within this dorsiflexion [rad] (the heel cannot come up)."}
        swingClearance: {type: double, default_value: 0.05, description: "Swing-knee flexion is reduced so the
            template's own foot clearance peaks at this value [m] (the planner's swing path is a hard constraint);
            <= 0 keeps the human swing knee."}
        heightFromLegs: {type: bool, default_value: true, description: "With `base`, the pelvis height reference is
            the stance legs' template put through planar FK (foot flat), as an offset from the standing posture,
            averaged over both legs in double support; replaces heightOscillation."}
        thighLength: {type: double, default_value: 0.3366, description: "Hip pitch axis to knee axis [m] for heightFromLegs."}
        shankLength: {type: double, default_value: 0.3, description: "Knee axis to ankle pitch axis [m] for heightFromLegs."}
        shoulderAmplitude: {type: double, default_value: 0.35, description: "Shoulder pitch swing at referenceSpeed
            [rad].", validation: {gt_eq: [0.0]}}
        elbowAmplitude: {type: double, default_value: 0.15, description: "Elbow swing at referenceSpeed [rad].",
            validation: {gt_eq: [0.0]}}
        elbowMean: {type: double, default_value: 0.0, description: "Constant elbow offset from the nominal while the
            template is on [rad] (negative straightens the shipped 1.2 rad elbow towards a human arm)."}
        armMaxOffset: {type: double, default_value: 0.6, description: "Clamp on the arm offsets [rad] (collision
            envelope, see armSwing.maxOffset).", validation: {gt: [0.0]}}
        waistYawAmplitude: {type: double, default_value: 0.08, description: "Trunk counter-rotation at full scale
            [rad].", validation: {gt_eq: [0.0]}}
        pelvisRollAmplitude: {type: double, default_value: 0.05, description: "Pelvis obliquity at full scale [rad],
            swing side down.", validation: {gt_eq: [0.0]}}
        pelvisPitchAmplitude: {type: double, default_value: 0.0, description: "Pelvis pitch oscillation at full scale
            [rad], twice per cycle."}
        heightOscillation: {type: double, default_value: 0.015, description: "Pelvis vertical excursion at full scale
            [m], high at mid single stance, low in double support.", validation: {gt_eq: [0.0]}}
    gait:
      phaseTransitionStanceTime: {type: double, default_value: 0.0, description: "Minimum stance time inserted at
          phase transitions [s]"}
      stairClimbingFile: {type: string, default_value: "", description: "YAML file with the fixed-sequence stair
          climbing parameters, see config/terrains/stair_climbing/. Empty disables the stair_climb target mode."}
      terrainWalkingFile: {type: string, default_value: "", description: "YAML file with the online terrain-aware
          walking parameters (terrain geometry + planner settings), see config/terrains/terrain_walking/.
          Empty disables the terrain_walk target mode."}
      initialModeSequence: {type: string_array, default_value: ["STANCE", "STANCE"], description: "Initial mode
          schedule mode sequence"}
      initialEventTimes: {type: double_array, default_value: [0.5], description: "Initial mode schedule event times
          [s]"}
      defaultModeSequence: {type: string_array, default_value: ["STANCE"], description: "Default mode sequence template
          applied after the initial schedule"}
      defaultSwitchingTimes: {type: double_array, default_value: [0.0, 0.5], description: "Switching times of the
          default mode sequence template [s]"}
      contactSync:
        enabled: {type: bool, default_value: false, description: "Contact-synchronised touchdown: the planned touchdown
            event of a swinging foot is moved to the solve time when its measured sole reaches the support plane inside
            earlyWindow before it, and held (up to lateWindow) while the sole is still in the air after it. The plan
            then loads the foot when it lands instead of 20-50 ms later (docs/results/human_gait_template.md runs
            12-17). Flat-ground modes only; the stair and terrain modes ignore it."}
        earlyWindow: {type: double, default_value: 0.06, description: "Landings this long [s] before the planned
            touchdown advance it to the solve time; the double support absorbs the lead. 0 disables the early half",
            validation: {gt_eq: [0.0]}}
        lateWindow: {type: double, default_value: 0.0, description: "The planned touchdown is pushed back, holdStep at
            a time, while the foot is still in the air, up to this long [s] after the originally planned time; 0
            disables the late half", validation: {gt_eq: [0.0]}}
        heightThreshold: {type: double, default_value: 0.002, description: "Sole height above the support plane [m] at
            or below which the foot counts as landed (the G1 sole rests at ~0.3 mm; the swing passes 2 mm about
            40 ms before the planned touchdown at 0.2 m/s). Only with descentVelocity > 0 can it be opened to
            ~1 cm (a stopped sole on a slightly higher tile): the descent test then keeps airborne soles out",
            validation: {gt_eq: [0.0]}}
        holdStep: {type: double, default_value: 0.02, description: "A held touchdown is pushed this far [s] past the
            solve time, i.e. about one MPC node", validation: {gt: [0.0]}}
        minPhaseDuration: {type: double, default_value: 0.02, description: "No phase is shortened below this [s] by
            either half", validation: {gt_eq: [0.0]}}
        descentVelocity: {type: double, default_value: 0.0, description: "Uneven ground (run 22 D): a sole within
            heightThreshold of the support plane that is still descending faster than this [m/s] is NOT landed (it is
            passing the plane towards lower ground). Also the 'stopped' threshold of blockedHeight. 0 keeps the
            height-only rule", validation: {gt_eq: [0.0]}}
        blockedHeight: {type: double, default_value: 0.0, description: "Uneven ground (run 22 D): a sole that has
            stopped descending at least this far [m] above its planned swing height, while the plan descends or has
            finished, IS landed (it stands on ground higher than the plane). Needs descentVelocity > 0. 0 = off",
            validation: {gt_eq: [0.0]}}
      swingTrajectory:
        liftOffVelocity: {type: double, default_value: 0.05, description: "Swing foot lift-off vertical velocity [m/s]"}
        touchDownVelocity: {type: double, default_value: -0.0, description: "Swing foot touch-down vertical velocity
            [m/s]"}
        swingHeight: {type: double, default_value: 0.08, description: "Swing apex height [m]"}
        touchDownHeightOffset: {type: double, default_value: -0.001, description: "Touch-down height offset [m]"}
        swingTimeScale: {type: double, default_value: 0.4, description: "Swing durations shorter than this are scaled
            down [s]"}
        impactProximityFactorLiftOffVelocity: {type: double, default_value: -0.15, description: "Impact proximity
            factor at lift-off velocity"}
        impactProximityFactorTouchDownVelocity: {type: double, default_value: 0.3, description: "Impact proximity
            factor at touch-down velocity"}
        impactProximityFactorMidPointValue: {type: double, default_value: 0.0, description: "Impact proximity factor
            mid-point value"}
      templates:
        names: {type: string_array, default_value: [], description: "Names of the gait templates, each defined as
            ocs2.gait.templates.<name>. The gait ladder and the stair/terrain modes select templates by these names.",
            validation: {unique<>: null}}
        __map_names:
          swingHeight: {type: double, default_value: -1.0, description: "Swing clearance [m] for this gait; -1 inherits gait.swingTrajectory.swingHeight. Short swings still use swingTimeScale.",
              validation: {gt_eq: [-1.0]}}
          modeSequence: {type: string_array, default_value: [], description: "The template's N modes in order: STANCE
              (both feet in contact), LF (left foot in contact, right swings), RF (right foot in contact) or FLY (no contact)",
              validation: {subset_of<>: [["STANCE", "LF", "RF", "FLY"]]}}
          switchingTimes: {type: double_array, default_value: [], description: "N+1 increasing switching times of the
              template's N modes [s]; the template repeats with period last - first"}
      continuous:
        enabled: {type: bool, default_value: false, description: "Speed-continuous walking gait: while the ladder is
            on its first walking rung, the step time, double support and swing clearance below (interpolated at the
            conditioned command's speed, re-tiled from the next step boundary at every solve) replace the rung's
            template. The ladder then only decides standing vs walking; higher rungs are ignored. Needs
            gait.phaseTransitionStanceTime 0."}
        speedKnots: {type: double_array, default_value: [0.0, 0.45, 0.8, 1.15], description: "Increasing gait speeds
            [m/s] (planar speed + yawLever x |yaw rate|) the tables are given at; clamped outside the range"}
        stepTime: {type: double_array, default_value: [0.72, 0.72, 0.55, 0.48], description: "Lift-off to the other
            foot's lift-off [s] per knot. Step length = speed x stepTime; the defaults are human regressions scaled to
            the G1's leg length (docs/results/lowspeed_gait.md)"}
        doubleSupport: {type: double_array, default_value: [0.25, 0.25, 0.12, 0.09], description: "Double-support time
            inside each step [s] per knot; the swing is stepTime - doubleSupport"}
        swingHeight: {type: double_array, default_value: [0.05, 0.05, 0.05, 0.06], description: "Swing clearance [m]
            per knot"}
        yawLever: {type: double, default_value: 0.15, description: "Lever arm [m] converting the yaw-rate command into
            gait speed, so turning in place steps at a sensible cadence", validation: {gt_eq: [0.0]}}
        minDoubleSupport: {type: double, default_value: 0.03, description: "Double supports shorter than this [s] are
            not planned (alternating single supports instead)", validation: {gt_eq: [0.0]}}
        spliceDelay: {type: double, default_value: 0.1, description: "The schedule is re-tiled from the first step
            boundary later than initTime + this [s]; the step in progress is never changed", validation: {gt_eq: [0.0]}}
        standBelow: {type: double, default_value: 0.15, description: "Planar commands slower than this [m/s] are
            rounded to standing", validation: {gt_eq: [0.0]}}
        minWalkSpeed: {type: double, default_value: 0.4, description: "Planar commands between standBelow and this
            [m/s] are raised to it (direction kept): the slowest speed at which the gait looks like walking. 0 disables
            the rounding", validation: {gt_eq: [0.0]}}
      transitions:
        minDwellTime: {type: double, default_value: 0.2, description: "Minimum time between two gait changes [s]",
            validation: {gt_eq: [0.0]}}
        switchDelayHorizonFraction: {type: double, default_value: 0.7, description: "A new gait starts at the first
            contact event after initTime + this fraction of the MPC horizon", validation: {gt_eq: [0.0], lt_eq: [1.0]}}
        ladder: {type: string_array, default_value: [], description: "Gaits the velocity-based selection steps through,
            slowest to fastest and one rung per change. The first must be stance; each must be in ocs2.gait.templates.names
            and defined as ocs2.gait.transitions.<gait>.", validation: {unique<>: null}}
        __map_ladder:
          linearVelocity: {type: double_array, default_value: [], description: "Command band [min, max] on |vx| and
              |vy| [m/s] this rung serves: go up when either exceeds max, down when both are below min", validation: {
                fixed_size<>: [2]}}
          yawRate: {type: double_array, default_value: [], description: "Command band [min, max] on |yaw rate| [rad/s]
              this rung serves", validation: {fixed_size<>: [2]}}
          measuredMargin: {type: double_array, default_value: [], description: "[linear m/s, yaw rad/s]: go up only
              once the measured speed exceeds max - margin, down only once it is below min + margin", validation: {
                fixed_size<>: [2], lower_element_bounds<>: [0.0]}}
  visualization:
    frameId: {type: string, default_value: "world", description: "Visualization marker frame"}
    update_rate: {type: double, default_value: 30.0, description: "Performance visualization update rate",
        validation: {gt_eq: [0.0]}}
    optimizedStateRobotModelsActivate: {type: bool, default_value: true,
        description: "Enable subscriber-driven future and terminal robot mesh ghosts"}
    optimizedStateRobotModelsInterval: {type: double, default_value: 0.2,
        description: "Nominal temporal spacing of mesh ghosts across the actual MPC policy horizon [s]",
        validation: {gt: [0.0]}}
    collisionSpheres:
      activate: {type: bool, default_value: false, description: "Draw enabled arm/body and leg collision spheres at the observed state"}
      markerTopic: {type: string, default_value: "/performance_visualization/collisionSpheres",
          description: "Best-effort collision sphere marker topic"}
      alpha: {type: double, default_value: 0.25, description: "Collision sphere opacity",
          validation: {gt: [0.0], lt_eq: [1.0]}}
    trajectory:
      activate: {type: bool, default_value: true, description: "Enable optimized trajectory visualization"}
      markerTopic: {type: string, default_value: "/performance_visualization/optimizedStateTrajectory",
          description: "Topic for optimized trajectory visualization markers"}
      frame_names: {type: string_array, default_value: [], description: "Frame names to visualize along the optimized
          MPC trajectory", validation: {unique<>: null}}
      lineWidth: {type: double, default_value: 0.005, description: "Line width of the optimized trajectory marker",
        validation: {gt_eq: [0.0]}}
      pointScale: {type: double, default_value: 0.01, description: "Point scale of the optimized trajectory samples",
        validation: {gt_eq: [0.0]}}
