        implementation: {type: string, default_value: "polynomial", description: "Compact-support polynomial penalty, or relaxed logarithmic barrier", validation: {one_of<>: [["rbf", "polynomial"]]}}
        mu: {type: double, default_value: 3000.0, description: "Penalty strength; log and polynomial implementations use different scales", validation: {gt: [0.0]}}
        delta: {type: double, default_value: 0.02, description: "Relaxation distance [m]; RBF curvature inside the boundary is mu/delta^2", validation: {gt: [0.0]}}
        arms:
